apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-deploy-executor
  namespace: directus
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-deploy-executor-secret-bootstrap
  namespace: directus
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Force=true
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: directus
      restartPolicy: Never
      volumes:
        - name: vault-root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: bootstrap
          image: alpine/k8s:1.31.4
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: vault-root-token
              mountPath: /vault-token
              readOnly: true
          command:
            - /bin/sh
            - -ec
          args:
            - |
              apk add --no-cache curl jq >/dev/null

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              cat >/tmp/platform-deploy-executor-policy.hcl <<'EOF'
              path "secret/data/platform-deploy-service" {
                capabilities = ["read"]
              }

              path "secret/data/platform-deploy-service/*" {
                capabilities = ["read"]
              }

              path "secret/data/auth-gateway-admin-api" {
                capabilities = ["read"]
              }
              EOF

              policy_payload="$(jq -Rs '{policy:.}' /tmp/platform-deploy-executor-policy.hcl)"
              policy_code="$(curl -sS -o /tmp/platform-deploy-executor-policy-write.json -w '%{http_code}' \
                -X PUT \
                -H "X-Vault-Token: ${VAULT_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "${policy_payload}" \
                "${VAULT_ADDR}/v1/sys/policies/acl/platform-deploy-executor" || true)"
              if [ "${policy_code}" != "200" ] && [ "${policy_code}" != "204" ]; then
                echo "Failed to write platform-deploy-executor Vault policy (HTTP ${policy_code})."
                cat /tmp/platform-deploy-executor-policy-write.json || true
                exit 1
              fi

              role_payload="$(jq -nc '{
                bound_service_account_names:["platform-deploy-executor"],
                bound_service_account_namespaces:["directus"],
                token_policies:["platform-deploy-executor"],
                token_ttl:"24h"
              }')"
              role_code="$(curl -sS -o /tmp/platform-deploy-executor-role-write.json -w '%{http_code}' \
                -X POST \
                -H "X-Vault-Token: ${VAULT_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "${role_payload}" \
                "${VAULT_ADDR}/v1/auth/kubernetes/role/platform-deploy-executor" || true)"
              if [ "${role_code}" != "200" ] && [ "${role_code}" != "204" ]; then
                echo "Failed to write platform-deploy-executor Vault Kubernetes auth role (HTTP ${role_code})."
                cat /tmp/platform-deploy-executor-role-write.json || true
                exit 1
              fi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-platform-deploy-executor
  namespace: directus
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent.pid"
    exit_after_auth = false

    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "platform-deploy-executor"
        }
      }

      sink "file" {
        config = {
          path = "/vault-secrets/vault-token"
          mode = 0644
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-deploy-executor
  namespace: directus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    reloader.stakater.com/auto: "true"
  labels:
    app: platform-deploy-executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-deploy-executor
  template:
    metadata:
      annotations:
        platform.suncoast.systems/restart-revision: "2026-08-05-notification-scope-vars"
        reloader.stakater.com/auto: "true"
      labels:
        app: platform-deploy-executor
    spec:
      serviceAccountName: platform-deploy-executor
      nodeSelector:
        work-node: "true"
      containers:
        - name: vault-agent
          image: hashicorp/vault:1.15.4
          command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault-config
            - name: vault-secrets
              mountPath: /vault-secrets
        - name: platform-deploy-executor
          image: "ghcr.io/dotcomrow/platform-deploy-executor:latest"
          imagePullPolicy: Always
          resources:
            requests:
              ephemeral-storage: "2Gi"
            limits:
              ephemeral-storage: "12Gi"
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: EXECUTOR_MODE
              value: "terraform_cloud"
            - name: AUTH_REQUIRED
              value: "true"
            - name: INTERNAL_TOKEN_VAULT_PATH
              value: "secret/data/platform-deploy-service"
            - name: INTERNAL_TOKEN_VAULT_KEY
              value: "token"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN_FILE
              value: "/vault-secrets/vault-token"
            - name: OPENAPI_SERVER_URL
              value: "http://platform-deploy-executor.directus.svc.cluster.local:8080"
            - name: WORKSPACE_ROOT
              value: "/workspace/platform-deploy-executor"
            - name: OPENOBSERVE_BROWSER_RUM_CACHE_DIR
              value: "/workspace/cache/openobserve-browser-rum"
            - name: TFE_TOKEN_VAULT_PATH
              value: "secret/data/platform-deploy-service"
            - name: TFE_TOKEN_VAULT_KEYS
              value: "tfe_token,tfe-token,tf_api_token"
            - name: TFE_AGENT_POOL_ID_VAULT_PATH
              value: "secret/data/platform-deploy-service"
            - name: TFE_AGENT_POOL_ID_VAULT_KEYS
              value: "tfe_agent_pool_id,tfe-agent-pool-id"
            - name: TFE_ORGANIZATION_VAULT_PATH
              value: "secret/data/platform-deploy-service"
            - name: TFE_ORGANIZATION_VAULT_KEYS
              value: "tfe_organization,tfe-organization,tf_cloud_organization"
            - name: GITHUB_TOKEN_VAULT_PATH
              value: "secret/data/platform-deploy-service/github"
            - name: GITHUB_TOKEN_VAULT_KEYS
              value: "token,github_token,github-token"
            - name: GITHUB_AUTH_MODE
              value: "auto"
            - name: GITHUB_AUTH_MODE_VAULT_PATH
              value: "secret/data/platform-deploy-service/github"
            - name: GITHUB_AUTH_MODE_VAULT_KEYS
              value: "github_auth_mode,auth_mode,github-auth-mode"
            - name: GITHUB_APP_ID_VAULT_PATH
              value: "secret/data/platform-deploy-service/github"
            - name: GITHUB_APP_ID_VAULT_KEYS
              value: "app_id,github_app_id,github-app-id"
            - name: GITHUB_APP_INSTALLATION_ID_VAULT_PATH
              value: "secret/data/platform-deploy-service/github"
            - name: GITHUB_APP_INSTALLATION_ID_VAULT_KEYS
              value: "installation_id,github_app_installation_id,github-app-installation-id"
            - name: GITHUB_APP_PRIVATE_KEY_VAULT_PATH
              value: "secret/data/platform-deploy-service/github"
            - name: GITHUB_APP_PRIVATE_KEY_VAULT_KEYS
              value: "private_key,github_app_private_key,github-app-private-key"
            - name: APP_AUTH_GATEWAY_ADMIN_TOKEN_VAULT_PATH
              value: "secret/data/auth-gateway-admin-api"
            - name: APP_AUTH_GATEWAY_ADMIN_TOKEN_VAULT_KEYS
              value: "value"
            - name: CLOUDFLARE_TOKEN_VAULT_PATH
              value: "secret/data/platform-deploy-service"
            - name: CLOUDFLARE_TOKEN_VAULT_KEYS
              value: "cloudflare_token,cloudflare-token"
            - name: CLOUDFLARE_ACCOUNT_ID_VAULT_PATH
              value: "secret/data/platform-deploy-service"
            - name: CLOUDFLARE_ACCOUNT_ID_VAULT_KEYS
              value: "cloudflare_account_id,cloudflare-account-id"
            - name: CLOUDFLARE_ZONE_ID_VAULT_PATH
              value: "secret/data/platform-deploy-service"
            - name: CLOUDFLARE_ZONE_ID_VAULT_KEYS
              value: "cloudflare_zone_id,cloudflare-zone-id"
            - name: PRODUCTION_DEPLOY_READY_TIMEOUT_MS
              value: "600000"
            - name: PRODUCTION_DEPLOY_READY_POLL_MS
              value: "2000"
            - name: REQUEST_TIMEOUT_MS
              value: "15000"
            - name: RATE_MAX
              value: "60"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault-secrets
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-platform-deploy-executor
        - name: vault-secrets
          emptyDir:
            sizeLimit: "16Mi"
        - name: workspace
          emptyDir:
            sizeLimit: "12Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: platform-deploy-executor
  namespace: directus
  labels:
    app: platform-deploy-executor
spec:
  selector:
    app: platform-deploy-executor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
